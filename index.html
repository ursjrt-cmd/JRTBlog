async function authenticateMasterAdmin(email, password) {
  if (!app.sb) throw new Error(app.connectionError || 'Supabase is not connected. Configure the project URL and publishable key first.');
  const cleanEmail = String(email || '').trim().toLowerCase();
  if (!cleanEmail || !String(password || '')) throw new Error('Enter your admin email and password.');
  const { data, error } = await app.sb.auth.signInWithPassword({ email:cleanEmail, password:String(password) });
  if (error) throw error;
  app.user = data?.user || null;
  app.adminApproved = false;
  let profileError = null;
  try { await loadProfile(); } catch (err) { profileError = err; console.error('JRT profile lookup after sign-in:', err); }
  await verifyAdminMembership();
  if (!isAdmin()) {
    await app.sb.auth.signOut();
    app.user = null;
    app.profile = null;
    app.adminApproved = false;
    const detail = profileError ? ` Profile lookup also failed: ${profileError.message}` : '';
    throw new Error(`Supabase authenticated this account, but it is not approved for the JRT Mart dashboard. Run the updated Admin Access SQL in Admin → Setup (or the supplied SQL file) and verify ${MASTER_ADMIN_EMAIL} in Supabase Auth.${detail}`);
  }
  return true;
}

async function requestAdminPasswordReset() {
  if (!app.sb) throw new Error(app.connectionError || 'Supabase is not connected.');
  const email = String($('#adminLoginEmail')?.value || MASTER_ADMIN_EMAIL).trim().toLowerCase();
  if (!email) throw new Error('Enter your admin email address first.');
  if (location.protocol === 'file:') throw new Error('Password reset links require the hosted website URL. Deploy JRT Mart and add that URL to Supabase Auth → URL Configuration first.');
  const redirectTo = `${location.origin}${location.pathname}#/admin`;
  const { error } = await app.sb.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) throw error;
  toast('Password reset email sent. Check your inbox and spam folder.');
}

async function uploadImage(file, folder) {
  if (!file) return '';
  if (!app.sb || !app.user) throw new Error('Sign in to the JRT Mart admin account before uploading images.');
  const allowedTypes = { 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/gif':'gif' };
  if (!allowedTypes[file.type]) throw new Error(`Unsupported image format: ${file.name}. Use JPG, PNG, WebP or GIF.`);
  if (file.size > 8 * 1024 * 1024) throw new Error(`${file.name} is larger than 8 MB. Please resize it and upload again.`);
  const ext = allowedTypes[file.type];
  const safeFolder = ['products','categories','brand'].includes(folder) ? folder : 'products';
  const path = `${app.user.id}/${safeFolder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await app.sb.storage.from('jrt-assets').upload(path, file, {
    cacheControl:'3600', upsert:false, contentType:file.type
  });
  if (error) throw error;
  const publicUrl = app.sb.storage.from('jrt-assets').getPublicUrl(path).data.publicUrl;
  if (!publicUrl) throw new Error('Image uploaded, but Supabase did not return a public image URL. Check the jrt-assets bucket settings.');
  return publicUrl;
}

async function uploadHeroMedia(file, type) {
  if (!file) return null;
  if (!app.sb || !app.user || !isAdmin()) throw new Error('Sign in to the JRT Mart administrator account before uploading hero media.');
  const imageTypes = { 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/gif':'gif' };
  let ext = '';
  if (type === 'image') {
    ext = imageTypes[file.type] || '';
    if (!ext) throw new Error(`${file.name}: use JPG, PNG, WebP or GIF for hero photos.`);
    if (file.size > 8 * 1024 * 1024) throw new Error(`${file.name} is larger than 8 MB. Resize this image and upload it again.`);
  } else {
    if (file.type !== 'video/mp4' && !/\.mp4$/i.test(file.name)) throw new Error(`${file.name}: only MP4 video files are supported for the hero background.`);
    if (file.size > 100 * 1024 * 1024) throw new Error(`${file.name} is larger than 100 MB. Compress the video and upload it again.`);
    ext = 'mp4';
  }
  const safeName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const path = `${app.user.id}/hero/${safeName}`;
  const contentType = type === 'video' ? 'video/mp4' : file.type;
  const { error } = await app.sb.storage.from('jrt-assets').upload(path, file, {
    cacheControl:'3600', upsert:false, contentType
  });
  if (error) throw error;
  const url = app.sb.storage.from('jrt-assets').getPublicUrl(path).data.publicUrl;
  if (!url || !safeUrl(url)) throw new Error(`Uploaded ${file.name}, but Supabase did not return a valid public URL. Check the jrt-assets bucket settings.`);
  return { id:`hero-${Date.now()}-${Math.random().toString(36).slice(2,8)}`, type, name:file.name, url };
}

async function getOrCreateDefaultStore() {

// Form Handlers
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  if (f.dataset.submitting === 'true') return;
  f.dataset.submitting = 'true';
  const submitButton = f.querySelector('button[type="submit"],button:not([type])');
  const submitLabel = submitButton?.innerHTML || '';
  if (submitButton) {
    submitButton.disabled = true;
    submitButton.setAttribute('aria-busy', 'true');
    submitButton.innerHTML = '<span class="button-spinner" aria-hidden="true"></span> Please wait…';
  }
  const fd = new FormData(f);
  const kind = f.dataset.form;

  try {
    if (kind === 'search') {
      const q = String(fd.get('q') || '').trim();
      const cat = String(fd.get('category') || '');
      app.searchQuery = q;
      if (cat && q) {
        const scope = `category:${cat}`;
        app.listingFilters[scope] = { ...listingState(scope), query:q };
        location.hash = `#/category/${encodeURIComponent(cat)}`;
      } else {
        location.hash = cat ? `#/category/${encodeURIComponent(cat)}` : (q ? `#/search/${encodeURIComponent(q)}` : '#/products');
      }
      return;
    }

    if (kind === 'listing-filters') {
      const scope = String(f.dataset.scope || 'all');
      const attrs = {};
      for (const [key, value] of fd.entries()) {
        if (key.startsWith('attr_') && String(value).trim()) {
          const attrKey = key.slice(5);
          (attrs[attrKey] ||= []).push(String(value));
        }
      }
      app.listingFilters[scope] = {
        query:String(fd.get('query') || '').trim(),
        priceMin:String(fd.get('priceMin') || '').trim(),
        priceMax:String(fd.get('priceMax') || '').trim(),
        maxMoq:String(fd.get('maxMoq') || '').trim(),
        availability:String(fd.get('availability') || ''),
        categorySlug:String(fd.get('categorySlug') || ''),
        sort:listingState(scope).sort || 'featured',
        attrs
      };
      render();
      return;
    }

    if (kind === 'deliver') {
      const pin = String(fd.get('pincode') || '').trim();
      if (!/^\d{6}$/.test(pin)) return toast('Enter a valid 6-digit PIN code.', true);
      let city = '';
      try {
        const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
        const json = await res.json();
        city = json?.[0]?.PostOffice?.[0]?.District || '';
      } catch {}
      app.deliver = { city, pin, label: city ? `${city} ${pin}` : `PIN ${pin}` };
      localStorage.setItem(DELIVER_KEY, JSON.stringify(app.deliver));
      closeModal();
      render();
      toast(`Delivery location set to ${app.deliver.label}`);
      return;
    }

    if (kind === 'admin-login') {
      const email = String(fd.get('email')).trim();
      const password = String(fd.get('password'));
      await authenticateMasterAdmin(email, password);
      await refresh();
      location.hash = '#/admin';
      toast('Welcome to JRT Mart Master Admin Control!');
      return;
    }

    if (kind === 'admin-update-password') {
      if (!app.sb || !app.user || !app.passwordRecovery) throw new Error('Open the password-reset link sent by Supabase before updating your password.');
      const password = String(fd.get('password') || '');
      const confirmPassword = String(fd.get('password_confirm') || '');
      if (password.length < 8) throw new Error('Use a password with at least 8 characters.');
      if (password !== confirmPassword) throw new Error('The passwords do not match.');
      const { error } = await app.sb.auth.updateUser({ password });
      if (error) throw error;
      app.passwordRecovery = false;
      await loadProfile();
      await refresh();
      location.hash = '#/admin';
      toast('Your administrator password has been updated.');
      return;
    }

    if (kind === 'auth') {
      const mode = fd.get('mode');
      const email = String(fd.get('email')).trim();
      const password = String(fd.get('password'));
      if (!app.sb) throw new Error('Supabase connection unavailable.');
      if (mode === 'signup') {
        const { error } = await app.sb.auth.signUp({ email, password, options: { data: { full_name: fd.get('full_name') } } });
        if (error) throw error;
        closeModal();
        toast('Account created! Check email or sign in.');
      } else {
        const { error } = await app.sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        closeModal();
        toast('Signed in successfully.');
      }
      return;
    }

    if (kind === 'save-config') {
      const nextUrl = String(fd.get('url') || '').trim();
      const nextKey = String(fd.get('key') || '').trim();
      if (!nextUrl || !nextKey) throw new Error('Enter both the Supabase project URL and publishable key.');
      localStorage.setItem('jrtmart_config', JSON.stringify({ SUPABASE_URL:nextUrl, SUPABASE_ANON_KEY:nextKey }));
      await initSupabase();
      await refresh();
      toast('Supabase connection updated and verified.');
      return;
    }

    if (kind === 'admin-save-product') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Supabase is not connected or you are signed out. Product changes were not saved.');
      const id = String(fd.get('id') || '');
      const isSeed = id.startsWith('seed-') || id.startsWith('prod-');
      const name = String(fd.get('name') || '').trim();
      const catVal = String(fd.get('category_id') || '');
      const catObj = app.categories.find(c => c.id === catVal || c.slug === catVal);
      if (!name) throw new Error('Enter a product name.');
      if (!catObj) throw new Error('Choose a valid product category.');
      if (!catObj.id) throw new Error('This category is only in the starter catalogue. Open Admin → Sections & Categories and sync the starter categories to Supabase first.');
      const price = Number(fd.get('price'));
      const mrp = fd.get('mrp') ? Number(fd.get('mrp')) : null;
      const stock = Number(fd.get('stock') || 0);
      const minOrderQty = Number(fd.get('min_order_qty') || 1);
      const taxPercent = Number(fd.get('tax_percent') || 0);
      if (!Number.isFinite(price) || price < 0) throw new Error('Enter a valid selling price (zero or more).');
      if (mrp !== null && (!Number.isFinite(mrp) || mrp < price)) throw new Error('MRP must be a valid amount equal to or greater than the selling price.');
      if (!Number.isInteger(stock) || stock < 0) throw new Error('Stock must be a whole number of zero or more.');
      if (!Number.isInteger(minOrderQty) || minOrderQty < 1) throw new Error('Minimum order quantity must be at least 1.');
      if (!Number.isFinite(taxPercent) || taxPercent < 0 || taxPercent > 100) throw new Error('GST / tax must be between 0 and 100 percent.');

      const typedImageUrls = String(fd.get('image_urls') || '').split(/\r?\n/).map(v => v.trim()).filter(Boolean);
      const invalidImageUrl = typedImageUrls.find(url => !siteImageUrl(url));
      if (invalidImageUrl) throw new Error(`This image URL is invalid: ${invalidImageUrl}`);
      const selectedFiles = Array.from(f.elements.image_files?.files || []);
      if (selectedFiles.length > 8) throw new Error('Choose a maximum of 8 uploaded images per product.');
      const uploadedImageUrls = selectedFiles.length
        ? await Promise.all(selectedFiles.map(file => uploadImage(file, 'products')))
        : [];
      const images = Array.from(new Set([...typedImageUrls.map(siteImageUrl), ...uploadedImageUrls])).filter(Boolean);
      if (!images.length) {
        images.push(productPhotoFor({ name, category_id:catObj.id, category_slug:catObj.slug, images:[] }));
      }
      if (images.length > 8) throw new Error('A product can have up to 8 images. Remove extra URLs or files.');
      const attributes = {};
      $$('[name^="attr_"]', f).forEach(input => {
        const value = String(input.value || '').trim();
        if (value) attributes[input.name.slice(5)] = value;
      });
      if (isSeed) attributes._seed_id = id;
      else if (app.adminEditingProduct?.attributes?._seed_id) attributes._seed_id = app.adminEditingProduct.attributes._seed_id;
      const storeVal = String(fd.get('store_id') || '').trim();
      const storeId = storeVal || await getOrCreateDefaultStore();
      const payload = {
        store_id:storeId,
        category_id:catObj.id,
        name,
        slug:slugify(name) + '-' + Date.now().toString(36).slice(-5),
        sku:String(fd.get('sku') || '').trim() || null,
        price,
        mrp,
        tax_percent:taxPercent,
        stock,
        min_order_qty:minOrderQty,
        status:String(fd.get('status') || 'published'),
        images,
        attributes,
        is_featured:fd.get('is_featured') === 'true',
        short_description:String(fd.get('short_description') || ''),
        description:String(fd.get('description') || '')
      };
      if (id && !isSeed) {
        delete payload.slug;
        const { error } = await app.sb.from('products').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        const { error } = await app.sb.from('products').insert(payload);
        if (error) throw error;
      }
      app.adminEditingProduct = null;
      await refresh();
      toast(id && !isSeed ? 'Product updated and saved in Supabase.' : 'Product published and saved in Supabase.');
      return;
    }

    if (kind === 'admin-save-category') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before saving categories.');
      const id = String(fd.get('id') || '');
      const origSlug = String(fd.get('orig_slug') || '');
      let imgUrl = String(fd.get('image_url') || '').trim();
      if (imgUrl && !siteImageUrl(imgUrl)) throw new Error('Use a valid HTTP(S) category image URL or upload your own image. Factori-hosted photo URLs are no longer accepted.');
      const file = f.elements.image_file?.files?.[0];
      if (file && app.user) imgUrl = await uploadImage(file, 'categories');
      const name = String(fd.get('name')).trim();
      const payload = {
        name,
        slug: slugify(name),
        group_name: String(fd.get('group_name')).trim(),
        indicative_from: fd.get('indicative_from') ? Number(fd.get('indicative_from')) : null,
        in_stock: fd.get('in_stock') === 'true',
        image_url: imgUrl || null,
        sort_order: Number(fd.get('sort_order') || 0),
        is_active: fd.get('is_active') === 'true',
        filter_schema: parseFilterSchemaEditor(fd.get('filter_schema_text'))
      };
      if (app.sb && app.user) {
        const { error } = id
          ? await app.sb.from('categories').update(payload).eq('id', id)
          : await app.sb.from('categories').upsert(payload, { onConflict: 'slug' });
        if (error) throw error;
        app.adminEditingCategory = null;
        await refresh();
        toast('Category & section saved to Supabase!');
        return;
      }
      const idx = app.categories.findIndex(c => c.slug === (origSlug || payload.slug));
      if (idx >= 0) app.categories[idx] = { ...app.categories[idx], ...payload };
      else app.categories.push(payload);
      app.adminEditingCategory = null;
      render();
      toast('Category & section updated.');
      return;
    }

    if (kind === 'save-hero-media') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in as an administrator before uploading hero media.');
      const selectedImages = Array.from(f.elements.hero_images?.files || []);
      const selectedVideos = Array.from(f.elements.hero_videos?.files || []);
      const currentMedia = getHeroMedia();
      if (currentMedia.filter(x => x.type === 'image').length + selectedImages.length > 12) throw new Error('The hero can contain up to 12 photos. Remove some existing photos first.');
      if (currentMedia.filter(x => x.type === 'video').length + selectedVideos.length > 8) throw new Error('The hero can contain up to 8 MP4 videos. Remove some existing videos first.');

      const uploaded = [];
      for (const file of selectedImages) {
        toast(`Uploading hero photo: ${file.name}`);
        uploaded.push(await uploadHeroMedia(file, 'image'));
      }
      for (const file of selectedVideos) {
        toast(`Uploading hero video: ${file.name}`);
        uploaded.push(await uploadHeroMedia(file, 'video'));
      }
      const nextBrand = {
        ...app.brand,
        hero_media:[...currentMedia, ...uploaded].map((item, index) => ({ ...item, sort_order:index })),
        hero_media_enabled:fd.get('hero_media_enabled') === 'true',
        hero_video_muted:fd.get('hero_video_muted') === 'true',
        hero_video_sound_control:fd.get('hero_video_sound_control') === 'true',
        hero_media_opacity:Math.max(8, Math.min(82, Number(fd.get('hero_media_opacity') || 72))),
        hero_image_duration:Math.max(3, Math.min(20, Number(fd.get('hero_image_duration') || 6)))
      };
      const { error } = await app.sb.from('site_settings').upsert({ key:'brand', value:nextBrand });
      if (error) throw error;
      app.brand = nextBrand;
      heroPlaybackMemory = { key:'', index:0, time:0, finished:false, wasPlaying:null, muted:null };
      render();
      toast(`Hero media saved to Supabase. ${uploaded.length} new file(s) uploaded.`);
      return;
    }

    if (kind === 'save-brand') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in as an administrator before saving branding.');
      const fileFieldMap = [
        ['header_logo_file','header_logo_url'], ['footer_logo_file','footer_logo_url'],
        ['preloader_logo_file','preloader_logo_url'], ['preloader_bg_file','preloader_bg_image_url'],
        ['admin_login_logo_file','admin_login_logo_url'], ['admin_login_bg_file','admin_login_bg_image_url']
      ];
      const uploadedBrandAssets = {};
      for (const [fileName, targetKey] of fileFieldMap) {
        const file = f.elements[fileName]?.files?.[0];
        const typedUrl = String(fd.get(targetKey) || '').trim();
        if (typedUrl && !siteImageUrl(typedUrl)) throw new Error(`${targetKey.replace(/_/g,' ')} must be a valid HTTP(S) image URL and cannot use Factori-hosted photos.`);
        uploadedBrandAssets[targetKey] = file ? await uploadImage(file, 'brand') : (typedUrl || app.brand[targetKey] || '');
      }
      const sharedLogo = String(fd.get('logo_url') || '').trim();
      if (sharedLogo && !siteImageUrl(sharedLogo)) throw new Error('Default logo URL must be a valid HTTP(S) image URL and cannot use Factori-hosted photos.');
      const preloaderDuration = Math.max(500, Math.min(8000, Number(fd.get('preloader_duration_ms') || 1200)));
      const nextBrand = {
        ...app.brand,
        site_name: fd.get('site_name'),
        tagline: fd.get('tagline'),
        kicker: fd.get('kicker'),
        hero_title: fd.get('hero_title'),
        hero_highlight: fd.get('hero_highlight'),
        hero_subtitle: fd.get('hero_subtitle'),
        stat_1_val: fd.get('stat_1_val'), stat_1_lbl: fd.get('stat_1_lbl'),
        stat_2_val: fd.get('stat_2_val'), stat_2_lbl: fd.get('stat_2_lbl'),
        stat_3_val: fd.get('stat_3_val'), stat_3_lbl: fd.get('stat_3_lbl'),
        contact_email: fd.get('contact_email'),
        contact_phone: fd.get('contact_phone'),
        shipping_fee_rupees: Number(fd.get('shipping_fee_rupees') || 0),
        logo_url: sharedLogo || app.brand.logo_url || '',
        logo_square_enabled: fd.get('logo_square_enabled') === 'true',
        ...uploadedBrandAssets,
        preloader_title: String(fd.get('preloader_title') || '').trim(),
        preloader_subtitle: String(fd.get('preloader_subtitle') || '').trim(),
        preloader_bg_color: safeBrandColor(fd.get('preloader_bg_color'), '#092D4F'),
        preloader_enabled: fd.get('preloader_enabled') === 'true',
        preloader_duration_ms: preloaderDuration,
        admin_login_bg_color: safeBrandColor(fd.get('admin_login_bg_color'), '#092D4F'),
        admin_login_eyebrow: String(fd.get('admin_login_eyebrow') || '').trim(),
        admin_login_title: String(fd.get('admin_login_title') || '').trim(),
        admin_login_highlight: String(fd.get('admin_login_highlight') || '').trim(),
        admin_login_description: String(fd.get('admin_login_description') || '').trim(),
        announcement: fd.get('announcement')
      };
      const { error } = await app.sb.from('site_settings').upsert({ key: 'brand', value: nextBrand });
      if (error) throw error;
      app.brand = nextBrand;
      try { localStorage.setItem('jrtmart_brand_cache_v1', JSON.stringify(nextBrand)); } catch {}
      render();
      applyPreloaderBrand();
      toast('Homepage, header/footer logos, preloader and admin login branding saved in Supabase.');
      return;
    }

    if (kind === 'save-page') {
      if (!isAdmin()) throw new Error('Admin access required.');
      const payload = {
        slug: slugify(fd.get('slug')),
        title: String(fd.get('title')).trim(),
        body: String(fd.get('body')),
        is_published: true
      };
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in as an administrator before saving pages.');
      const { error } = await app.sb.from('content_pages').upsert(payload, { onConflict: 'slug' });
      if (error) throw error;
      await refresh();
      toast('Page saved & published in Supabase.');
      return;
    }

    if (kind === 'checkout') {
      if (!app.sb || !app.user) throw new Error('Sign in and connect Supabase before saving an order.');
      const items = cart().map(it => ({ it, p: app.products.find(p => p.id === it.id) })).filter(x => x.p);
      if (!items.length) throw new Error('Your cart is empty.');
      const subtotalPaise = items.reduce((a, x) => a + Math.round(Number(x.p.price) * 100) * x.it.qty, 0);
      const taxPaise = items.reduce((a, x) => a + Math.round(Number(x.p.price) * 100 * Number(x.p.tax_percent || 0) / 100) * x.it.qty, 0);
      const shippingPaise = Math.round(Number(app.brand.shipping_fee_rupees || 0) * 100);
      const totalPaise = subtotalPaise + taxPaise + shippingPaise;
      const address = Object.fromEntries(fd.entries());
      const { data:order, error:orderError } = await app.sb.from('orders').insert({
        user_id:app.user.id,
        subtotal_paise:subtotalPaise,
        tax_paise:taxPaise,
        shipping_paise:shippingPaise,
        total_paise:totalPaise,
        shipping_address:address,
        order_status:'pending_payment',
        payment_status:'created'
      }).select().single();
      if (orderError) throw orderError;
      const isUuid = value => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
      const itemRows = items.map(({it,p}) => ({
        order_id:order.id,
        product_id:isUuid(p.id) ? p.id : null,
        store_id:isUuid(p.store_id) ? p.store_id : null,
        product_name:p.name,
        image_url:siteImageUrl(p.images?.[0]) || productPhotoFor(p),
        unit_price_paise:Math.round(Number(p.price) * 100),
        tax_percent:Number(p.tax_percent || 0),
        quantity:it.qty,
        line_total_paise:Math.round(Number(p.price) * 100 * it.qty)
      }));
      const { error:itemError } = await app.sb.from('order_items').insert(itemRows);
      if (itemError) throw itemError;
      app.orders.unshift(order);
      saveCart([]);
      location.hash = '#/orders';
      toast('Order request saved in Supabase. Payment remains pending until a payment gateway is connected.');
      return;
    }

    if (kind === 'quote') {
      toast('Bulk quote request received! Our team will contact you shortly.');
      f.reset();
      return;
    }

    if (kind === 'profile') {
      if (!app.sb || !app.user) throw new Error('Sign in and connect Supabase before saving your profile.');
      const { error } = await app.sb.from('profiles').update({ full_name: fd.get('full_name'), phone: fd.get('phone') }).eq('id', app.user.id);
      if (error) throw error;
      await loadProfile();
      render();
      toast('Profile saved in Supabase.');
      return;
    }

    if (kind === 'create-store') {
      if (!app.sb || !app.user) throw new Error('Sign in with a customer/seller account to register a store.');
      const { error } = await app.sb.from('stores').insert({
        owner_id: app.user.id,
        name: fd.get('name'),
        slug: slugify(fd.get('slug')),
        tagline: fd.get('tagline'),
        description: fd.get('description'),
        contact_email: fd.get('contact_email'),
        contact_phone: fd.get('contact_phone')
      });
      if (error) throw error;
      await refresh();
      toast('Store application submitted!');
      return;
    }

    if (kind === 'seller-save-product') {
      const name = String(fd.get('name')).trim();
      const { error } = await app.sb.from('products').insert({
        store_id: app.store.id,
        category_id: fd.get('category_id'),
        name,
        slug: slugify(name) + '-' + Date.now().toString(36).slice(-4),
        price: Number(fd.get('price')),
        stock: Number(fd.get('stock')),
        images: fd.get('image_url') ? [fd.get('image_url')] : [],
        description: fd.get('description')
      });
      if (error) throw error;
      await refresh();
      toast('Product submitted for admin review.');
      return;
    }

    if (kind === 'review') {
      const pid = f.dataset.product;
      const { error } = await app.sb.from('product_reviews').upsert({
        product_id: pid,
        user_id: app.user.id,
        rating: Number(fd.get('rating')),
        title: fd.get('title'),
        review: fd.get('review')
      }, { onConflict: 'product_id,user_id' });
      if (error) throw error;
      const { data } = await app.sb.from('product_reviews').select('*').eq('product_id', pid);
      app.reviews = data || [];
      render();
      toast('Review submitted.');
    }
  } catch (err) {
    console.error(err);
    toast(err.message || 'Operation failed.', true);
  } finally {
    f.dataset.submitting = 'false';
    if (submitButton) {
      submitButton.disabled = false;
      submitButton.removeAttribute('aria-busy');
      submitButton.innerHTML = submitLabel;
    }
  }
});

// Click Action Handlers
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  e.preventDefault();
  const act = b.dataset.action;
  const id = b.dataset.id;

  try {
    if (act === 'close-mega-menu') {
      const flyout = $('#beta-nav-flyout');
      if (flyout) flyout.hidden = true;
      return;
    }
    if (act === 'clear-listing-filters') {
      const scope = b.dataset.scope || 'all';
      app.listingFilters[scope] = { query:'', priceMin:'', priceMax:'', maxMoq:'', availability:'', sort:'featured', categorySlug:'', attrs:{} };
      render();
      return;
    }
    if (act === 'toggle-filters') {
      $('#listingFilterSidebar')?.classList.toggle('open');
      return;
    }
    if (act === 'open-deliver') return openDeliverModal();
    if (act === 'open-auth') return authModal(b.dataset.mode || 'login');
    if (act === 'auth-tab') return authModal(b.dataset.tab);
    if (act === 'close-modal') return closeModal();
    if (act === 'toggle-password') {
      const input = $('#adminLoginPassword');
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.textContent = show ? 'Hide' : 'Show';
      b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      b.setAttribute('aria-pressed', String(show));
      return;
    }
    if (act === 'admin-reset-password') {
      await requestAdminPasswordReset();
      return;
    }

    if (act === 'signout') {
      if (app.sb) {
        const { error } = await app.sb.auth.signOut();
        if (error) throw error;
      }
      app.user = null; app.profile = null; app.store = null; app.adminApproved = false;
      await refresh();
      toast('Signed out securely.');
      return;
    }

    if (act === 'select-thumb') {
      app.activeGalleryImg = b.dataset.url;
      render();
      return;
    }

    if (act === 'add-cart') {
      const p = app.products.find(x => x.id === id);
      if (!p) return;
      const qtyInput = b.dataset.qtyInput ? $('#' + b.dataset.qtyInput) : null;
      const qty = Math.max(1, Number(qtyInput?.value || p.min_order_qty || 1));
      const c = cart();
      const ex = c.find(x => x.id === id);
      if (ex) ex.qty += qty;
      else c.push({ id, qty });
      saveCart(c);
      toast(`Added ${qty} × ${p.name} to cart.`);
      return;
    }

    if (act === 'cart-qty') {
      const c = cart();
      const item = c.find(x => x.id === id);
      if (item) {
        item.qty += Number(b.dataset.delta);
        if (item.qty < 1) c.splice(c.indexOf(item), 1);
      }
      saveCart(c);
      render();
      return;
    }

    if (act === 'remove-cart') {
      saveCart(cart().filter(x => x.id !== id));
      render();
      return;
    }

    if (act === 'admin-tab') {
      app.adminTab = b.dataset.tab;
      render();
      return;
    }

    if (act === 'admin-preview-home') {
      location.hash = '#/';
      window.scrollTo({ top:0, behavior:'smooth' });
      return;
    }

    if (act === 'hero-toggle-audio') {
      const video = $('#heroMediaStage video.hero-media-video.is-active');
      if (!video || video.ended || video.dataset.finished === 'true') return;
      video.muted = !video.muted;
      heroPlaybackMemory.muted = video.muted;
      syncHeroAudioButton(video);
      return;
    }

    if (act === 'remove-hero-media') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before removing hero media.');
      const mediaId = b.dataset.id;
      if (!confirm('Remove this photo/video from the live hero section? The file will remain in Supabase Storage.')) return;
      const nextBrand = { ...app.brand, hero_media:getHeroMedia().filter(item => item.id !== mediaId) };
      const { error } = await app.sb.from('site_settings').upsert({ key:'brand', value:nextBrand });
      if (error) throw error;
      app.brand = nextBrand;
      heroPlaybackMemory = { key:'', index:0, time:0, finished:false, wasPlaying:null, muted:null };
      render();
      toast('Hero media removed from the storefront.');
      return;
    }

    if (act === 'admin-edit-product') {
      app.adminEditingProduct = app.products.find(p => p.id === id) || null;
      render();
      window.scrollTo({ top: 150, behavior: 'smooth' });
      return;
    }
    if (act === 'cancel-admin-edit') { app.adminEditingProduct = null; render(); return; }

    if (act === 'delete-product') {
      if (!confirm('Permanently delete this product?')) return;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before deleting products.');
      if (!id.startsWith('seed-') && !id.startsWith('prod-')) {
        const { error } = await app.sb.from('products').delete().eq('id', id);
        if (error) throw error;
      } else {
        throw new Error('This is a starter catalogue example, not a saved database product. Add it to Supabase first before deleting it permanently.');
      }
      app.products = app.products.filter(x => x.id !== id);
      render();
      toast('Product deleted.');
      return;
    }

    if (act === 'edit-cat') {
      app.adminEditingCategory = app.categories.find(c => c.slug === b.dataset.slug) || null;
      render();
      window.scrollTo({ top: 150, behavior: 'smooth' });
      return;
    }
    if (act === 'cancel-edit-cat') { app.adminEditingCategory = null; render(); return; }

    if (act === 'delete-cat') {
      if (!confirm('Delete this category?')) return;
      const slug = b.dataset.slug;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before deleting categories.');
      const { error } = await app.sb.from('categories').delete().eq('slug', slug);
      if (error) throw error;
      app.categories = app.categories.filter(c => c.slug !== slug);
      render();
      toast('Category deleted.');
      return;
    }

    if (act === 'rename-section') {
      const oldGroup = b.dataset.group;
      const newGroup = prompt(`Rename section "${oldGroup}" to:`, oldGroup);
      if (!newGroup || newGroup.trim() === oldGroup) return;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before renaming sections.');
      const { error } = await app.sb.from('categories').update({ group_name: newGroup.trim() }).eq('group_name', oldGroup);
      if (error) throw error;
      app.categories.forEach(c => { if (c.group_name === oldGroup) c.group_name = newGroup.trim(); });
      render();
      toast('Section renamed.');
      return;
    }

    if (act === 'delete-section') {
      const grp = b.dataset.group;
      if (!confirm(`Delete ENTIRE section "${grp}" and all categories inside it?`)) return;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before deleting sections.');
      const { error } = await app.sb.from('categories').delete().eq('group_name', grp);
      if (error) throw error;
      app.categories = app.categories.filter(c => c.group_name !== grp);
      render();
      toast(`Section "${grp}" deleted.`);
      return;
    }

    if (act === 'seed-categories') {
      if (!isAdmin()) throw new Error('Admin access required.');
      if (!app.sb || !app.user) throw new Error('Connect Supabase & run SQL schema first.');
      const rows = rawCats.map(c => ({
        name: c.name, slug: c.slug, group_name: c.group_name,
        image_url: c.image_url, indicative_from: c.indicative_from,
        in_stock: c.in_stock !== false, sort_order: c.sort_order, is_active: true,
        filter_schema: categoryFilterSchema(c).map(f => ({ key:f.key, label:f.label, options:f.options || [] }))
      }));
      const { error } = await app.sb.from('categories').upsert(rows, { onConflict: 'slug' });
      if (error) throw error;
      await refresh();
      toast(`All ${rows.length} starter categories synced to Supabase!`);
      return;
    }

    if (act === 'load-page-editor') {
      const slug = $('#pageSelect').value;
      const p = app.pages.find(x => x.slug === slug) || fallbackPages[slug] || { title: slug, body: '' };
      $('#pageSlug').value = slug;
      $('#pageTitle').value = p.title;
      $('#pageBody').value = p.body;
      return;
    }

    if (act === 'new-page-editor') {
      $('#pageSlug').value = '';
      $('#pageTitle').value = '';
      $('#pageBody').value = '';
      return;
    }

    if (act === 'delete-page') {
      const slug = slugify($('#pageSlug').value);
      if (!slug) return toast('Load or enter a page slug first.', true);
      if (!confirm(`Delete page "/${slug}"?`)) return;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before deleting pages.');
      const { error } = await app.sb.from('content_pages').delete().eq('slug', slug);
      if (error) throw error;
      app.pages = app.pages.filter(p => p.slug !== slug);
      render();
      toast('Page deleted.');
      return;
    }

    if (act === 'store-status') {
      const { error } = await app.sb.from('stores').update({ status: b.dataset.status }).eq('id', id);
      if (error) throw error;
      await refresh();
      toast('Store status updated.');
      return;
    }

    if (act === 'delete-store') {
      if (!confirm('Delete this store and all its listings?')) return;
      const { error } = await app.sb.from('stores').delete().eq('id', id);
      if (error) throw error;
      await refresh();
      toast('Store deleted.');
      return;
    }

    if (act === 'update-order-status') {
      const status = $(`[data-order-status="${id}"]`).value;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before updating orders.');
      const { error } = await app.sb.from('orders').update({ order_status: status }).eq('id', id);
      if (error) throw error;
      const o = app.orders.find(x => x.id === id);
      if (o) o.order_status = status;
      render();
      toast('Order status updated.');
      return;
    }

    if (act === 'delete-order') {
      if (!confirm('Delete this order record?')) return;
      if (!app.sb || !app.user) throw new Error('Connect Supabase and sign in before deleting orders.');
      const { error } = await app.sb.from('orders').delete().eq('id', id);
      if (error) throw error;
      app.orders = app.orders.filter(x => x.id !== id);
      render();
      toast('Order deleted.');
      return;
    }

    if (act === 'toggle-role') {
      const { error } = await app.sb.from('profiles').update({ role: b.dataset.role }).eq('id', id);
      if (error) throw error;
      await refresh();
      toast('User role updated.');
      return;
    }

    if (act === 'copy-template') {
      await navigator.clipboard.writeText($('#' + b.dataset.id).textContent);
      toast('SQL copied to clipboard.');
    }
  } catch (err) {
    console.error(err);
    toast(err.message || 'Action failed.', true);
  }
});


document.addEventListener('change', e => {
  const sel = e.target.closest('[data-list-sort]');
  if (!sel) return;
  const scope = sel.dataset.listSort || 'all';
  const current = listingState(scope);
  app.listingFilters[scope] = { ...current, sort:sel.value };
  render();
});

window.addEventListener('hashchange', async () => {
  closeModal();
  const navFlyout = $('#beta-nav-flyout');
  if (navFlyout) navFlyout.hidden = true;
  app.activeGalleryImg = '';
  if (location.hash.startsWith('#/product/')) {
    const pid = decodeURIComponent(location.hash.split('/')[2] || '');
    if (app.sb && pid && !pid.startsWith('seed-') && !pid.startsWith('prod-')) {
      const { data } = await app.sb.from('product_reviews').select('*').eq('product_id', pid);
      app.reviews = data || [];
    }
  }
  render();
  window.scrollTo(0, 0);
});

async function boot() {
  try {
    try {
      const cachedBrand = JSON.parse(localStorage.getItem('jrtmart_brand_cache_v1') || 'null');
      if (cachedBrand && typeof cachedBrand === 'object') app.brand = { ...app.brand, ...cachedBrand };
      applyPreloaderBrand();
    } catch {}
    await initSupabase();
    await loadData();
  } catch (e) {
    console.error('JRT Mart startup error:', e);
    app.connectionError = e.message || 'Supabase startup failed.';
  }
  render();
  applyPreloaderBrand();
  dismissPreloader();
  if (app.connectionError && location.hash === '#/admin') {
    toast(app.connectionError, true);
  }
}

boot();
})();
</script>
</body>
</html>
